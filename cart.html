<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elegance Reborn - Curated modest clothing, blazers, overcoats, suits and bags. Quality fabrics with classic designs in South Africa.">
    <meta name="keywords" content="modest clothing, blazers, overcoats, suits, tote bags, South Africa fashion">
    <title>Your Cart - Elegance Reborn</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <h1>ELEGANCE REBORN</h1>
            <p>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="products.html">Products</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact Us</a>
                <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
            </p>
        </nav>
    </header>

    <main>
        <section>
            <h2>Your Shopping Cart</h2>

            <!-- Cart items will load here -->
            <div id="cartItems"></div>

            <!-- Total price -->
            <h3>Total: R<span id="cartTotal">0.00</span></h3>

            <!-- Buttons -->
            <button id="clearCartBtn" class="add-to-cart-btn" style="background:#D4A5A5; margin-top:2rem;">Clear Cart</button>

            <a href="thankyou.html">
                <button class="add-to-cart-btn" style="background:#1A1A40; color:white; margin-top:1rem;">Checkout</button>
            </a>
        </section>
    </main>

    <footer>
        <p>© 2025 Elegance Reborn. All rights reserved.</p>
    </footer>

<script>
// Load cart from localStorage
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function updateCartCount() {
    const countEl = document.getElementById('cartCount');
    if (countEl) countEl.textContent = cart.length;
}

function loadCart() {
    const cartDiv = document.getElementById('cartItems');
    const totalEl = document.getElementById('cartTotal');

    updateCartCount();

    if (cart.length === 0) {
        cartDiv.innerHTML = '<p style="text-align:center; font-size:1.3rem; padding:3rem;">Your cart is empty 😔<br><a href="products.html" style="color:#D4A5A5;">Go shop</a></p>';
        totalEl.textContent = '0.00';
        return;
    }

    // Group same items + same size together
    const groupedCart = {};
    cart.forEach(item => {
        const key = item.name + item.size;
        if (groupedCart[key]) {
            groupedCart[key].quantity++;
        } else {
            groupedCart[key] = {...item, quantity: 1};
        }
    });

    let html = '';
    let total = 0;

    Object.values(groupedCart).forEach((item) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        html += `
        <div style="background:white; padding:1.5rem; margin:1rem 0; border-radius:12px; border:2px solid #D4A5A5;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <div>
                    <h4 style="color:#1A1A40; margin:0 0 0.5rem 0;">${item.name}</h4>
                    <p style="margin:0;">Size: <strong>${item.size}</strong> | R${item.price.toFixed(2)} each</p>
                </div>
                <button onclick="removeItem('${item.name}', '${item.size}')" style="background:#c0392b; color:white; border:none; padding:0.5rem 1rem; border-radius:20px; cursor:pointer;">Remove All</button>
            </div>

            <!-- Qty Controls -->
            <div style="display:flex; align-items:center; gap:10px;">
                <button onclick="updateQuantity('${item.name}', '${item.size}', -1)" style="background:#D4A5A5; color:white; border:none; width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer;">-</button>
                <span style="font-weight:bold; font-size:1.2rem;">${item.quantity}</span>
                <button onclick="updateQuantity('${item.name}', '${item.size}', 1)" style="background:#1A1A40; color:white; border:none; width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer;">+</button>
                <span style="margin-left:auto; font-weight:bold;">Subtotal: R${itemTotal.toFixed(2)}</span>
            </div>
        </div>`;
    });

    cartDiv.innerHTML = html;
    totalEl.textContent = total.toFixed(2);
}

// Update quantity +/-
function updateQuantity(name, size, change) {
    if (change === 1) {
        // Add one more
        const item = cart.find(i => i.name === name && i.size === size);
        if (item) cart.push({name: item.name, price: item.price, size: item.size});
    } else {
        // Remove one
        const index = cart.findIndex(i => i.name === name && i.size === size);
        if (index > -1) cart.splice(index, 1);
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
}

// Remove all of one item
function removeItem(name, size) {
    cart = cart.filter(item =>!(item.name === name && item.size === size));
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
}

// Clear entire cart
document.getElementById('clearCartBtn').addEventListener('click', function() {
    if (confirm('Clear entire cart?')) {
        cart = [];
        localStorage.removeItem('cart');
        loadCart();
    }
});

// Load on page start
loadCart();
</script>
</body>
</html>
