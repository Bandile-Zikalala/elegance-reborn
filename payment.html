<!DOCTYPE html>
<html>
<head>
  <title>Payment - Elegance Reborn</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
   .payment-box { max-width: 500px; margin: 50px auto; padding: 30px; border: 1px solid #D4A5A5; border-radius: 10px; background: white; }
   .payment-option { border: 2px solid #eee; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; }
   .payment-option.active { border-color: #D4A5A5; background: #fff5f5; }
   .card-fields { display: none; margin-top: 15px; }
   .card-fields.show { display: block; }
   .pay-btn { width: 100%; padding: 15px; background: #D4A5A5; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
   .pay-btn:hover { background: #c48f8f; }
    input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <h1>ELEGANCE REBORN</h1>
      <p>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
      </p>
    </nav>
  </header>

  <div class="payment-box">
    <h2>Complete Your Payment</h2>
    <p id="totalAmount">Total: R0.00</p>
    
    <h3>Select Payment Method</h3>
    
    <div class="payment-option active" data-method="card">
      <b>💳 Credit/Debit Card</b>
      <div class="card-fields show">
        <input type="text" placeholder="Card Number: 1234 5678 9012 3456" maxlength="19">
        <input type="text" placeholder="MM/YY" maxlength="5">
        <input type="text" placeholder="CVV" maxlength="3">
      </div>
    </div>
    
    <div class="payment-option" data-method="payshap">
      <b>📱 PayShap - Instant EFT</b>
      <p style="font-size: 12px; color: gray;">You’ll be redirected to your bank app</p>
    </div>
    
    <div class="payment-option" data-method="eft">
      <b>🏦 EFT / Bank Transfer</b>
      <p style="font-size: 12px; color: gray;">Bank details shown after order</p>
    </div>
    
    <button class="pay-btn" id="payBtn">Pay Now R0.00</button>
  </div>
  
  <script>
    const total = localStorage.getItem('cartTotal') || '0.00';
    document.getElementById('totalAmount').textContent = 'Total: R' + total;
    document.getElementById('payBtn').textContent = 'Pay Now R' + total;
    
    document.querySelectorAll('.payment-option').forEach(opt => {
      opt.onclick = function() {
        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.card-fields').forEach(c => c.classList.remove('show'));
        if (this.dataset.method === 'card') {
          this.querySelector('.card-fields').classList.add('show');
        }
      };
    });
    
    document.getElementById('payBtn').onclick = function() {
      localStorage.removeItem('cart');
      localStorage.removeItem('cartTotal');
      window.location.href = 'thankyou.html';
    };
  </script>
</body>
</html>
